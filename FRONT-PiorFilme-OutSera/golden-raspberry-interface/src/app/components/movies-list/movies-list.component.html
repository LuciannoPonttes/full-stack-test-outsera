<h2>List movies</h2><section class="painel"><table><thead><tr><th>Id</th><th>Year<input type="number" placeholder="Filter by year" [(ngModel)]="filtroAno" (keyup.enter)="aplicarFiltros()"></th><th>Title</th><th>Winner?<select [(ngModel)]="filtroVencedor" (change)="aplicarFiltros()"><option value="">Yes/No</option><option value="true">Yes</option><option value="false">No</option></select></th></tr></thead><tbody><tr *ngFor="let filme of filmes"><td>{{filme.id}}</td><td>{{filme.year}}</td><td>{{filme.title}}</td><td>{{filme.winner ? 'Yes' : 'No'}}</td></tr></tbody></table><p *ngIf="carregando">Loading...</p><p class="erro" *ngIf="erro">{{erro}}</p><div class="acoes"><button (click)="aplicarFiltros()">Filtrar</button><button (click)="limparFiltros()">Limpar</button></div><div class="paginacao"><button (click)="paginaAnterior()" [disabled]="paginaAtual===0">«</button><span>Página {{paginaAtual+1}} de {{totalPaginas || 1}}</span><button (click)="proximaPagina()" [disabled]="paginaAtual+1>=totalPaginas">»</button></div></section>
